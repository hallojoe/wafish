name: SonarQube
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonarqube
  cancel-in-progress: false
jobs:
  analyze:
    # Community Build analyzes the main branch. Fork pull requests receive no token.
    if: vars.SONAR_HOST_URL != '' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Wafish.ReactUi/ClientApp/package-lock.json
      - name: Install browser test dependencies
        working-directory: src/Wafish.ReactUi/ClientApp
        run: npm ci && npx playwright install --with-deps chromium
      - name: Analyze and enforce the quality gate
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: bash scripts/sonar.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonar-coverage
          path: |
            artifacts/sonar/coverage.xml
            src/Wafish.ReactUi/ClientApp/coverage/lcov.info
