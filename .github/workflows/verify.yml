name: Verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages-and-storage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: dotnet build Wafish.slnx -c Release
      - run: dotnet run --project tests/Wafish.Regression -c Release --no-build -- --storage
        env:
          WAFISH_TEST_REPORT: artifacts/test-results/storage.json
      - run: python scripts/verify-packages.py
      - run: python tests/Wafish.PackageChecks/check-negative.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages-and-storage-${{ matrix.os }}
          path: |
            artifacts/test-results
            artifacts/package-checks
          retention-days: 14
          if-no-files-found: error
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python3 scripts/test-publication.py
      - run: python3 scripts/test-audit.py
      - run: python3 scripts/audit-dependencies.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: artifacts/dependency-audit
          retention-days: 30
          if-no-files-found: error
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      visitor-sessions:
        image: redis:8.6
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Wafish.ReactUi/ClientApp/package-lock.json
      - run: dotnet build Wafish.slnx -c Release
      - run: dotnet run --project tests/Wafish.Regression -c Release --no-build
        env:
          WAFISH_TEST_REPORT: artifacts/test-results/main.json
          WAFISH_EXTERNALLOGIN_REDIS: 127.0.0.1:${{ job.services['visitor-sessions'].ports['6379'] }}
      - run: dotnet run --project tests/Wafish.Regression -c Release --no-build -- --storage
        env:
          WAFISH_TEST_REPORT: artifacts/test-results/storage.json
      - run: dotnet run --project tests/Wafish.Administration.Regression -c Release --no-build
        env:
          WAFISH_TEST_REPORT: artifacts/test-results/administration.json
      - name: Install isolated Redis test executable
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Verify live Redis policies, outage, and recovery
        run: dotnet run --project tests/Wafish.Regression -c Release --no-build -- --redis
        env:
          WAFISH_REDIS_SERVER: /usr/bin/redis-server
          WAFISH_TEST_REPORT: artifacts/test-results/redis.json
      - run: npm run lint && npm run test:coverage && npm audit
        working-directory: src/Wafish.ReactUi/ClientApp
      - run: node --test --experimental-test-coverage src/Wafish.ReactUi/ClientApp/scripts/verify-assets.test.mjs
      - run: npm --prefix src/Wafish.ReactUi/ClientApp run test:fixtures
      - run: python3 scripts/check-frontend-build.py
      - run: npx playwright install --with-deps chromium
        working-directory: src/Wafish.ReactUi/ClientApp
      - run: npm run test:e2e
        working-directory: src/Wafish.ReactUi/ClientApp
        env:
          UI_TEST_NO_BUILD: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: |
            artifacts/test-results
            src/Wafish.ReactUi/ClientApp/test-results
          retention-days: 14
          if-no-files-found: error
