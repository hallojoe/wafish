name: Publish selected Wafish packages
description: Verify packages, stage an exact selection, and publish to NuGet.org and GitHub Packages.
inputs:
  package:
    description: Exact package ID, or all.
    required: true
  version:
    description: Expected version from src/Directory.Build.props.
    required: true
  registry:
    description: both, nuget, or github.
    required: true
  dry-run:
    description: Build and validate without registry authentication or publication.
    required: true
  nuget-user:
    description: NuGet.org profile name for trusted publishing.
    required: false
  github-token:
    description: Repository GITHUB_TOKEN with packages write permission.
    required: true
runs:
  using: composite
  steps:
    - name: Check publication inputs
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
        REGISTRY: ${{ inputs.registry }}
        DRY_RUN: ${{ inputs.dry-run }}
        NUGET_USER: ${{ inputs.nuget-user }}
      run: |
        case "$REGISTRY" in both|nuget|github) ;; *) exit 1 ;; esac
        case "$DRY_RUN" in true|false) ;; *) exit 1 ;; esac
        if [[ "$DRY_RUN" == 'false' && "$REGISTRY" != 'github' && -z "$NUGET_USER" ]]; then
          echo 'Set the NUGET_USER repository or package-publishing environment variable.' >&2
          exit 1
        fi
        python3 scripts/prepare-publication.py --package "$PACKAGE" --version "$VERSION" --check-only
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: src/Wafish.ReactUi/ClientApp/package-lock.json
    - name: Build release binaries
      shell: bash
      run: dotnet build Wafish.slnx -c Release -p:ContinuousIntegrationBuild=true
    - name: Verify APIs and isolated package consumers
      shell: bash
      env:
        ContinuousIntegrationBuild: 'true'
      run: python3 scripts/verify-packages.py
    - name: Stage selected packages
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
      run: python3 scripts/prepare-publication.py --package "$PACKAGE" --version "$VERSION"
    - name: Retain exact publication artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ inputs.package }}-${{ inputs.version }}
        path: artifacts/publish/
        if-no-files-found: error
        retention-days: 30
    - name: NuGet.org trusted publishing login
      if: inputs.dry-run != 'true' && inputs.registry != 'github'
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ inputs.nuget-user }}
    - name: Publish to NuGet.org
      if: inputs.dry-run != 'true' && inputs.registry != 'github'
      shell: bash
      env:
        PUBLISH_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: bash scripts/push-packages.sh nuget
    - name: Publish to GitHub Packages
      if: inputs.dry-run != 'true' && inputs.registry != 'nuget'
      shell: bash
      env:
        PUBLISH_API_KEY: ${{ inputs.github-token }}
      run: bash scripts/push-packages.sh github
    - name: Publication summary
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
        REGISTRY: ${{ inputs.registry }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        {
          printf 'Package selection: `%s`\n\nVersion: `%s`\n\nRegistry: `%s`\n\nDry run: `%s`\n\n' "$PACKAGE" "$VERSION" "$REGISTRY" "$DRY_RUN"
          printf 'The artifact contains the package files, symbols, and a SHA-256 manifest.\n'
        } >> "$GITHUB_STEP_SUMMARY"
